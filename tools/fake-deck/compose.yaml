# Companion test bench for the P0 fake deck.
# Pinned to the latest stable release at the time of the spike; bump the tag deliberately.
# Host ports are remapped so this never clashes with a Companion already running on the desktop.
services:
  companion:
    image: ghcr.io/bitfocus/companion/companion:v5.1.3
    container_name: fake-deck-companion
    restart: "no"
    ports:
      - "18000:8000"   # web UI  -> http://localhost:18000
      - "26622:16622"  # Satellite TCP
    volumes:
      - ./companion-data:/companion
