# Keep compilation settings in this file and user/runtime settings in `esp-config.toml`.
include = ["esp-config.toml"]

# The default target is the Feather's (THI-84 KTD5). The P4-ETH build adds its target and
# board feature through the aliases below.
[build]
target = "xtensa-esp32-none-elf"

[target.xtensa-esp32-none-elf]
runner = "espflash flash --monitor --chip esp32"  # partitions and flash size come from espflash.toml
rustflags = [
  "-C", "link-arg=-nostartfiles",
]

[target.riscv32imafc-unknown-none-elf]
runner = "espflash flash --monitor --chip esp32p4"
rustflags = [
  # Required to obtain backtraces (e.g. when using the "esp-backtrace" crate.)
  # NOTE: May negatively impact performance of produced code
  "-C", "force-frame-pointers",
]

[alias]
# Waveshare ESP32-P4-ETH: `cargo p4` flashes and monitors, like `cargo run --release` does
# for the Feather.
p4 = "run --release --target riscv32imafc-unknown-none-elf --no-default-features --features board-p4-eth"
p4-build = "build --release --locked --target riscv32imafc-unknown-none-elf --no-default-features --features board-p4-eth"
p4-clippy = "clippy --release --locked --target riscv32imafc-unknown-none-elf --no-default-features --features board-p4-eth -- -D warnings"

[unstable]
build-std = ["alloc", "core"]
