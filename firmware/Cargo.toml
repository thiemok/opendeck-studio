# Generated from esp-generate 2.0.0 (-o esp32 -o unstable-hal -o alloc -o wifi -o embassy
# -o log -o esp-backtrace), then trimmed. Versions are pinned per KTD9; upgrading esp-radio
# (a 1.0 beta) is a deliberate migration.
[package]
edition      = "2024"
name         = "opendeck-firmware"
rust-version = "1.95"
version      = "0.1.0"
publish      = false

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32", "log-04", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp-alloc", "esp32", "log-04"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32", "log-04"] }
esp-storage = { version = "0.10.0", features = ["esp32"] }
esp-alloc = { version = "0.11.0", features = ["esp32"] }
esp-backtrace = { version = "0.20.0", features = ["esp32", "panic-handler", "println"] }
esp-println = { version = "0.18.0", features = ["esp32", "log-04"] }
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.1", features = ["log"] }
log = "0.4.27"

# The default debug profile is too slow and too big for resource-constrained devices.
[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = "fat"
opt-level     = "s"
