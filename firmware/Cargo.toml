# Generated from esp-generate 2.0.0 (-o esp32 -o unstable-hal -o alloc -o wifi -o embassy
# -o log -o esp-backtrace), then trimmed. Versions are pinned per KTD9; upgrading esp-radio
# (a 1.0 beta) is a deliberate migration. One codebase builds for two boards, picked by a
# feature (THI-84 KTD3); the chip features of the esp crates follow the board.
[package]
edition      = "2024"
name         = "opendeck-firmware"
rust-version = "1.95"
version      = "0.1.0"
publish      = false

[dependencies]
deck-core = { path = "../crates/deck-core" }

esp-hal = { version = "~1.2.2", features = ["log-04", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp-alloc", "log-04"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["embedded-storage", "log-04"] }
esp-storage = "0.10.0"
esp-alloc = "0.11.0"
esp-backtrace = { version = "0.20.0", features = ["panic-handler", "println"] }
esp-println = { version = "0.18.0", features = ["log-04"] }
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.1", features = ["log"] }
log = "0.4.27"

esp-radio = { version = "=1.0.0-beta.1", features = ["esp-alloc", "log-04", "unstable", "wifi"], optional = true }
embassy-net = { version = "0.9.1", features = ["dhcpv4", "dns", "log", "medium-ethernet", "tcp"] }
embassy-sync = "0.8"
embassy-futures = "0.1"
embedded-io-async = "0.7"
static_cell = "2.1.1"

mipidsi = "0.10.0"
embedded-graphics = "0.8"
embedded-hal = "1.0"
embedded-hal-bus = "0.3"

[features]
default = ["board-feather"]
# Adafruit Feather ESP32 V2, Wi-Fi. Build with `cargo build --release`.
board-feather = [
  "dep:esp-radio",
  "esp-alloc/esp32",
  "esp-backtrace/esp32",
  "esp-bootloader-esp-idf/esp32",
  "esp-hal/esp32",
  "esp-println/esp32",
  "esp-radio/esp32",
  "esp-rtos/esp-radio",
  "esp-rtos/esp32",
  "esp-storage/esp32",
]
# Waveshare ESP32-P4-ETH, Ethernet. Build with `cargo p4-build` (see .cargo/config.toml).
board-p4-eth = [
  "esp-alloc/esp32p4",
  "esp-backtrace/esp32p4",
  "esp-bootloader-esp-idf/esp32p4",
  "esp-hal/esp32p4",
  "esp-println/esp32p4",
  "esp-rtos/esp32p4",
  "esp-storage/esp32p4",
]

# The default debug profile is too slow and too big for resource-constrained devices.
[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = "fat"
opt-level     = "s"

# Feather only; the P4 build doesn't use xtensa-lx-rt.
# xtensa-lx-rt 0.23.0 splits its `Reset` routine across several `global_asm!` blocks, and
# recent toolchains don't keep them adjacent, so every app hangs before `main` on the ESP32.
# The vendored copy emits `Reset` as one block. See vendor/README.md.
[patch.crates-io]
xtensa-lx-rt = { path = "vendor/xtensa-lx-rt" }
