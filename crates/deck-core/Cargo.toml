[package]
name = "deck-core"
version = "0.1.0"
description = "Host-tested, no_std logic for the opendeck firmware: Satellite codec, session, decoding, debounce, console and config."
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
embedded-storage = "0.3.2"
# Inflate for PNG key images (THI-76). Without default features it needs neither std nor alloc.
miniz_oxide = { version = "0.8.9", default-features = false }

[dev-dependencies]
# Builds zlib streams for the PNG decoder tests.
miniz_oxide = { version = "0.8.9", features = ["with-alloc"] }
