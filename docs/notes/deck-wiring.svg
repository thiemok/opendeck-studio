<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1300" viewBox="0 0 1000 1300" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Deck wiring (THI-89): Feather ESP32 V2, MCP23017 expander, two ScreenKeys and the OLED/encoder module</title>
  <desc id="desc">Both ScreenKeys take 3V, GND, MO (GPIO19) to DIN, SCK (GPIO5) to SCLK, GPIO27 to DC and GPIO14 to PWM directly from the Feather. The MCP23017 breakout gets 3V (red), GND (black), GPIO22 SDA (blue) and GPIO20 SCL (yellow) through a STEMMA QT to breadboard cable plugged into its QT port; RST goes to 3V and IB (INTB) to GPIO37 with header wires. Expander GPA0 drives CS of key A, GPA1 CS of key B, GPA2 the shared RST. GPB0 reads KEY of key A, GPB1 KEY of key B, GPB2 the encoder push PSH, GPB3 BAK, GPB4 CON. The OLED/encoder module takes 3V, GND, GPIO22 SDA, GPIO20 SCL, GPIO34 TRA and GPIO4 TRB directly. Bench only: KEY of key A is also wired to GPIO32 as a timing reference.</desc>

  <!-- Opaque background so the diagram reads the same in light and dark viewers. -->
  <rect x="0" y="0" width="1000" height="1300" rx="12" fill="#ffffff"/>

  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Deck wiring (THI-89): keys and buttons through the MCP23017</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#555">Source of truth: the pin tables in deck-wiring.md and firmware/src/main.rs. Update this diagram whenever either changes.</text>

  <!-- Feather ESP32 V2 -->
  <rect x="40" y="120" width="220" height="1025" rx="14" fill="#e9f1fb" stroke="#3a4a5c" stroke-width="2"/>
  <rect x="110" y="102" width="80" height="22" rx="5" fill="#b9c3cf" stroke="#3a4a5c" stroke-width="1.5"/>
  <text x="150" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">USB-C</text>
  <text x="150" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">Adafruit Feather</text>
  <text x="150" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">ESP32 V2</text>
  <text x="150" y="1136" text-anchor="middle" font-size="11" fill="#555">silkscreen labels, grouped by signal</text>

  <!-- MCP23017 breakout -->
  <rect x="400" y="440" width="180" height="460" rx="14" fill="#fbeef3" stroke="#6b3a52" stroke-width="2"/>
  <text x="490" y="464" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">Adafruit MCP23017</text>
  <text x="490" y="482" text-anchor="middle" font-size="13" fill="#1a1a1a">I²C 0x20 (D0–D2 open)</text>
  <text x="490" y="720" text-anchor="middle" font-size="11" fill="#555">GPA7 and GPB7: output only,</text>
  <text x="490" y="734" text-anchor="middle" font-size="11" fill="#555">leave unused</text>
  <text x="490" y="874" text-anchor="middle" font-size="11" fill="#555">QT cable: plug on the breakout,</text>
  <text x="490" y="888" text-anchor="middle" font-size="11" fill="#555">pins in the Feather header</text>

  <!-- ScreenKeys A and B -->
  <rect x="720" y="120" width="240" height="570" rx="14" fill="#f3f1ec" stroke="#4d4636" stroke-width="2"/>
  <text x="840" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">2 × Waveshare 0.85"</text>
  <text x="840" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">ScreenKey Module B</text>
  <text x="840" y="680" text-anchor="middle" font-size="11" fill="#555">"A+B": wire both keys' pins to it</text>

  <!-- OLED/encoder module -->
  <rect x="720" y="705" width="240" height="440" rx="14" fill="#eef6ee" stroke="#3d5a3d" stroke-width="2"/>
  <text x="840" y="731" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">1.3" OLED + EC11 module</text>
  <text x="840" y="751" text-anchor="middle" font-size="13" fill="#1a1a1a">SH1106 at 0x3C, own pull-ups</text>
  <text x="840" y="1136" text-anchor="middle" font-size="11" fill="#555">header labels as on the front silkscreen</text>

  <!-- Feather straight to the keys -->
  <g font-size="13">
    <line x1="260" y1="210" x2="720" y2="210" stroke="#d62728" stroke-width="4" stroke-linecap="round"/>
    <circle cx="260" cy="210" r="6" fill="#d62728"/><circle cx="720" cy="210" r="6" fill="#d62728"/>
    <text x="245" y="215" text-anchor="end" font-weight="700" fill="#1a1a1a">3V</text>
    <text x="735" y="215" font-weight="700" fill="#1a1a1a">VCC (A+B)</text>
    <text x="490" y="202" text-anchor="middle" fill="#333">3.3 V power</text>

    <line x1="260" y1="246" x2="720" y2="246" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
    <circle cx="260" cy="246" r="6" fill="#222222"/><circle cx="720" cy="246" r="6" fill="#222222"/>
    <text x="245" y="251" text-anchor="end" font-weight="700" fill="#1a1a1a">GND</text>
    <text x="735" y="251" font-weight="700" fill="#1a1a1a">GND (A+B)</text>
    <text x="490" y="238" text-anchor="middle" fill="#333">ground</text>

    <line x1="260" y1="282" x2="720" y2="282" stroke="#1f77b4" stroke-width="4" stroke-linecap="round"/>
    <circle cx="260" cy="282" r="6" fill="#1f77b4"/><circle cx="720" cy="282" r="6" fill="#1f77b4"/>
    <text x="245" y="287" text-anchor="end" font-weight="700" fill="#1a1a1a">MO · GPIO19</text>
    <text x="735" y="287" font-weight="700" fill="#1a1a1a">DIN (A+B)</text>
    <text x="490" y="274" text-anchor="middle" fill="#333">SPI data (MOSI)</text>

    <line x1="260" y1="318" x2="720" y2="318" stroke="#d9a400" stroke-width="4" stroke-linecap="round"/>
    <circle cx="260" cy="318" r="6" fill="#d9a400"/><circle cx="720" cy="318" r="6" fill="#d9a400"/>
    <text x="245" y="323" text-anchor="end" font-weight="700" fill="#1a1a1a">SCK · GPIO5 †</text>
    <text x="735" y="323" font-weight="700" fill="#1a1a1a">SCLK (A+B)</text>
    <text x="490" y="310" text-anchor="middle" fill="#333">SPI clock</text>

    <line x1="260" y1="354" x2="720" y2="354" stroke="#2ca02c" stroke-width="4" stroke-linecap="round"/>
    <circle cx="260" cy="354" r="6" fill="#2ca02c"/><circle cx="720" cy="354" r="6" fill="#2ca02c"/>
    <text x="245" y="359" text-anchor="end" font-weight="700" fill="#1a1a1a">27 · GPIO27</text>
    <text x="735" y="359" font-weight="700" fill="#1a1a1a">DC (A+B)</text>
    <text x="490" y="346" text-anchor="middle" fill="#333">data / command</text>

    <line x1="260" y1="390" x2="720" y2="390" stroke="#8c564b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="260" cy="390" r="6" fill="#8c564b"/><circle cx="720" cy="390" r="6" fill="#8c564b"/>
    <text x="245" y="395" text-anchor="end" font-weight="700" fill="#1a1a1a">14 · GPIO14</text>
    <text x="735" y="395" font-weight="700" fill="#1a1a1a">PWM (A+B)</text>
    <text x="490" y="382" text-anchor="middle" fill="#333">backlight (driven high)</text>

    <line x1="260" y1="426" x2="720" y2="426" stroke="#7f7f7f" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6"/>
    <circle cx="260" cy="426" r="6" fill="#7f7f7f"/><circle cx="720" cy="426" r="6" fill="#7f7f7f"/>
    <text x="245" y="431" text-anchor="end" font-weight="700" fill="#1a1a1a">32 · GPIO32</text>
    <text x="735" y="431" font-weight="700" fill="#1a1a1a">KEY (key A), 2nd wire</text>
    <text x="490" y="418" text-anchor="middle" fill="#333">bench only: timing reference</text>
  </g>

  <!-- Feather to the MCP23017 -->
  <g font-size="13">
    <line x1="260" y1="510" x2="400" y2="510" stroke="#d62728" stroke-width="4" stroke-linecap="round"/>
    <circle cx="260" cy="510" r="6" fill="#d62728"/><circle cx="400" cy="510" r="6" fill="#d62728"/>
    <text x="245" y="515" text-anchor="end" font-weight="700" fill="#1a1a1a">3V</text>
    <text x="412" y="515" font-weight="700" fill="#1a1a1a">VIN</text>
    <text x="330" y="502" text-anchor="middle" font-size="11" font-weight="700" fill="#333">QT red</text>

    <line x1="260" y1="546" x2="400" y2="546" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
    <circle cx="260" cy="546" r="6" fill="#222222"/><circle cx="400" cy="546" r="6" fill="#222222"/>
    <text x="245" y="551" text-anchor="end" font-weight="700" fill="#1a1a1a">GND</text>
    <text x="412" y="551" font-weight="700" fill="#1a1a1a">GND</text>
    <text x="330" y="538" text-anchor="middle" font-size="11" font-weight="700" fill="#333">QT black</text>

    <line x1="260" y1="582" x2="400" y2="582" stroke="#1f77b4" stroke-width="4" stroke-linecap="round"/>
    <circle cx="260" cy="582" r="6" fill="#1f77b4"/><circle cx="400" cy="582" r="6" fill="#1f77b4"/>
    <text x="245" y="587" text-anchor="end" font-weight="700" fill="#1a1a1a">SDA · GPIO22</text>
    <text x="412" y="587" font-weight="700" fill="#1a1a1a">SDA</text>
    <text x="330" y="574" text-anchor="middle" font-size="11" font-weight="700" fill="#333">QT blue</text>

    <line x1="260" y1="618" x2="400" y2="618" stroke="#d9a400" stroke-width="4" stroke-linecap="round"/>
    <circle cx="260" cy="618" r="6" fill="#d9a400"/><circle cx="400" cy="618" r="6" fill="#d9a400"/>
    <text x="245" y="623" text-anchor="end" font-weight="700" fill="#1a1a1a">SCL · GPIO20</text>
    <text x="412" y="623" font-weight="700" fill="#1a1a1a">SCL</text>
    <text x="330" y="610" text-anchor="middle" font-size="11" font-weight="700" fill="#333">QT yellow</text>

    <line x1="260" y1="654" x2="400" y2="654" stroke="#e377c2" stroke-width="4" stroke-linecap="round"/>
    <circle cx="260" cy="654" r="6" fill="#e377c2"/><circle cx="400" cy="654" r="6" fill="#e377c2"/>
    <text x="245" y="659" text-anchor="end" font-weight="700" fill="#1a1a1a">37 · GPIO37 ‡</text>
    <text x="412" y="659" font-weight="700" fill="#1a1a1a">IB (INTB)</text>

    <line x1="260" y1="690" x2="400" y2="690" stroke="#d62728" stroke-width="4" stroke-linecap="round"/>
    <circle cx="260" cy="690" r="6" fill="#d62728"/><circle cx="400" cy="690" r="6" fill="#d62728"/>
    <text x="245" y="695" text-anchor="end" font-weight="700" fill="#1a1a1a">3V</text>
    <text x="412" y="695" font-weight="700" fill="#1a1a1a">RST</text>
  </g>

  <!-- MCP23017 to the keys -->
  <g font-size="13">
    <line x1="580" y1="510" x2="720" y2="510" stroke="#ff7f0e" stroke-width="4" stroke-linecap="round"/>
    <circle cx="580" cy="510" r="6" fill="#ff7f0e"/><circle cx="720" cy="510" r="6" fill="#ff7f0e"/>
    <text x="568" y="515" text-anchor="end" font-weight="700" fill="#1a1a1a">A0</text>
    <text x="735" y="515" font-weight="700" fill="#1a1a1a">CS (key A)</text>

    <line x1="580" y1="546" x2="720" y2="546" stroke="#ff7f0e" stroke-width="4" stroke-linecap="round"/>
    <circle cx="580" cy="546" r="6" fill="#ff7f0e"/><circle cx="720" cy="546" r="6" fill="#ff7f0e"/>
    <text x="568" y="551" text-anchor="end" font-weight="700" fill="#1a1a1a">A1</text>
    <text x="735" y="551" font-weight="700" fill="#1a1a1a">CS (key B)</text>

    <line x1="580" y1="582" x2="720" y2="582" stroke="#9467bd" stroke-width="4" stroke-linecap="round"/>
    <circle cx="580" cy="582" r="6" fill="#9467bd"/><circle cx="720" cy="582" r="6" fill="#9467bd"/>
    <text x="568" y="587" text-anchor="end" font-weight="700" fill="#1a1a1a">A2</text>
    <text x="735" y="587" font-weight="700" fill="#1a1a1a">RST (A+B)</text>

    <line x1="580" y1="618" x2="720" y2="618" stroke="#13a3b5" stroke-width="4" stroke-linecap="round"/>
    <circle cx="580" cy="618" r="6" fill="#13a3b5"/><circle cx="720" cy="618" r="6" fill="#13a3b5"/>
    <text x="568" y="623" text-anchor="end" font-weight="700" fill="#1a1a1a">B0</text>
    <text x="735" y="623" font-weight="700" fill="#1a1a1a">KEY (key A)</text>

    <line x1="580" y1="654" x2="720" y2="654" stroke="#13a3b5" stroke-width="4" stroke-linecap="round"/>
    <circle cx="580" cy="654" r="6" fill="#13a3b5"/><circle cx="720" cy="654" r="6" fill="#13a3b5"/>
    <text x="568" y="659" text-anchor="end" font-weight="700" fill="#1a1a1a">B1</text>
    <text x="735" y="659" font-weight="700" fill="#1a1a1a">KEY (key B)</text>
  </g>

  <!-- MCP23017 to the module's buttons -->
  <g font-size="13">
    <line x1="580" y1="790" x2="720" y2="790" stroke="#9467bd" stroke-width="4" stroke-linecap="round"/>
    <circle cx="580" cy="790" r="6" fill="#9467bd"/><circle cx="720" cy="790" r="6" fill="#9467bd"/>
    <text x="568" y="795" text-anchor="end" font-weight="700" fill="#1a1a1a">B2</text>
    <text x="735" y="795" font-weight="700" fill="#1a1a1a">PSH</text>

    <line x1="580" y1="826" x2="720" y2="826" stroke="#8c564b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="580" cy="826" r="6" fill="#8c564b"/><circle cx="720" cy="826" r="6" fill="#8c564b"/>
    <text x="568" y="831" text-anchor="end" font-weight="700" fill="#1a1a1a">B3</text>
    <text x="735" y="831" font-weight="700" fill="#1a1a1a">BAK</text>

    <line x1="580" y1="862" x2="720" y2="862" stroke="#ff7f0e" stroke-width="4" stroke-linecap="round"/>
    <circle cx="580" cy="862" r="6" fill="#ff7f0e"/><circle cx="720" cy="862" r="6" fill="#ff7f0e"/>
    <text x="568" y="867" text-anchor="end" font-weight="700" fill="#1a1a1a">B4</text>
    <text x="735" y="867" font-weight="700" fill="#1a1a1a">CON</text>
  </g>

  <!-- Feather straight to the module (front header order: CON SDA SCL PSH TRA TRB BAK GND VCC) -->
  <g font-size="13">
    <line x1="260" y1="930" x2="720" y2="930" stroke="#d62728" stroke-width="4" stroke-linecap="round"/>
    <circle cx="260" cy="930" r="6" fill="#d62728"/><circle cx="720" cy="930" r="6" fill="#d62728"/>
    <text x="245" y="935" text-anchor="end" font-weight="700" fill="#1a1a1a">3V</text>
    <text x="735" y="935" font-weight="700" fill="#1a1a1a">VCC</text>
    <text x="490" y="922" text-anchor="middle" fill="#333">3.3 V: keeps its pull-ups at ESP32 levels</text>

    <line x1="260" y1="966" x2="720" y2="966" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
    <circle cx="260" cy="966" r="6" fill="#222222"/><circle cx="720" cy="966" r="6" fill="#222222"/>
    <text x="245" y="971" text-anchor="end" font-weight="700" fill="#1a1a1a">GND</text>
    <text x="735" y="971" font-weight="700" fill="#1a1a1a">GND</text>
    <text x="490" y="958" text-anchor="middle" fill="#333">ground</text>

    <line x1="260" y1="1002" x2="720" y2="1002" stroke="#1f77b4" stroke-width="4" stroke-linecap="round"/>
    <circle cx="260" cy="1002" r="6" fill="#1f77b4"/><circle cx="720" cy="1002" r="6" fill="#1f77b4"/>
    <text x="245" y="1007" text-anchor="end" font-weight="700" fill="#1a1a1a">SDA · GPIO22</text>
    <text x="735" y="1007" font-weight="700" fill="#1a1a1a">SDA</text>
    <text x="490" y="994" text-anchor="middle" fill="#333">I²C data, shared with the expander</text>

    <line x1="260" y1="1038" x2="720" y2="1038" stroke="#d9a400" stroke-width="4" stroke-linecap="round"/>
    <circle cx="260" cy="1038" r="6" fill="#d9a400"/><circle cx="720" cy="1038" r="6" fill="#d9a400"/>
    <text x="245" y="1043" text-anchor="end" font-weight="700" fill="#1a1a1a">SCL · GPIO20</text>
    <text x="735" y="1043" font-weight="700" fill="#1a1a1a">SCL</text>
    <text x="490" y="1030" text-anchor="middle" fill="#333">I²C clock, shared with the expander</text>

    <line x1="260" y1="1074" x2="720" y2="1074" stroke="#2ca02c" stroke-width="4" stroke-linecap="round"/>
    <circle cx="260" cy="1074" r="6" fill="#2ca02c"/><circle cx="720" cy="1074" r="6" fill="#2ca02c"/>
    <text x="245" y="1079" text-anchor="end" font-weight="700" fill="#1a1a1a">A2 · GPIO34 ‡</text>
    <text x="735" y="1079" font-weight="700" fill="#1a1a1a">TRA</text>
    <text x="490" y="1066" text-anchor="middle" fill="#333">encoder phase A (PCNT)</text>

    <line x1="260" y1="1110" x2="720" y2="1110" stroke="#2ca02c" stroke-width="4" stroke-linecap="round"/>
    <circle cx="260" cy="1110" r="6" fill="#2ca02c"/><circle cx="720" cy="1110" r="6" fill="#2ca02c"/>
    <text x="245" y="1115" text-anchor="end" font-weight="700" fill="#1a1a1a">A5 · GPIO4</text>
    <text x="735" y="1115" font-weight="700" fill="#1a1a1a">TRB</text>
    <text x="490" y="1102" text-anchor="middle" fill="#333">encoder phase B (PCNT)</text>
  </g>

  <!-- Notes -->
  <g font-size="13" fill="#333">
    <text x="40" y="1190">† ESP32 strapping pin with a boot pull-up. ‡ Input-only pin with no internal pull-up: INTB is push-pull, the encoder has its own pull-ups.</text>
    <text x="40" y="1210">Expander A0–A7 / B0–B7 are its silkscreen (chip GPA0–GPB7), not the Feather's A0–A5. QT cable: red 3V, black GND, blue SDA, yellow SCL.</text>
    <text x="40" y="1230">Dashed grey: bench-only second wire from key A's KEY pin to GPIO32, for the edge-to-detection timing. Remove it after the bench.</text>
    <text x="40" y="1250">Freed on the Feather: GPIO15, 25, 26, 33, 36, 39. All buttons read low when pressed; BACK and CONFIRM are never sent to Companion.</text>
    <text x="40" y="1270">3.3 V only: never connect VCC or VIN to USB or BAT. Key calibration 2026-11-15: offset (2, 1), BGR, inverted colours.</text>
  </g>
</svg>
